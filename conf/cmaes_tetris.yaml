defaults:
  - _self_
  - tetris: ???

checkpoint: ???  # path to world model checkpoint

tetris_cfg: ${tetris.tetris}

plan_config:
  horizon: 5
  receding_horizon: 1
  action_block: 1

beam_width: 200
lazy: false
emb_dim: 192

checkpoint_interval: 1

# CMA-ES settings
cmaes:
  sigma0: 0.5
  opts:
    seed: 41
    maxiter: 500
    tolx: 1e-6
    tolfun: 1e-6
    verbose: 3
    tolflatfitness: 5

# Evaluation settings
max_steps: 100
n_eval_episodes: 1
consistency_lambda: 0.5
env_seed: null  # set to an integer to fix the Tetris env seed across all episodes

fitness:
  _target_: lewm.cmaes_tetris.ClearedRowsFitness

device: cuda
subdir: ${now:%s}_${hydra:job.id}

wandb:
  enabled: true
  config:
    entity: andrei-jardan-technical-university-of-munich
    project: genai-tetris
    name: cmaes_${tetris.out}
    id: ${subdir}
    resume: allow
