defaults:
  - _self_
  - tetris: ???

checkpoint: ???  # path to world model checkpoint

tetris_cfg: ${tetris.tetris}

plan_config:
  horizon: 5
  receding_horizon: 1
  action_block: 1

beam_width: 200
lazy: false
emb_dim: 192

# CMA-ES settings
sigma0: 0.5
max_iter: 500
checkpoint_interval: 1

# Evaluation settings
max_steps: 100
n_eval_episodes: 1
consistency_lambda: 0.5

device: cuda
subdir: ${now:%s}_${hydra:job.id}

wandb:
  enabled: true
  config:
    entity: andrei-jardan-technical-university-of-munich
    project: genai-tetris
    name: cmaes_${tetris.out}
    id: ${subdir}
    resume: allow
