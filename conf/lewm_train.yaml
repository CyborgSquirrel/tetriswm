defaults:
  - _self_
  - data: pusht
  - action_rank: ???
  - optimizers: default

output_model_name: lewm
checkpoint_interval: ${eval:'max(1, ${trainer.max_epochs} // 10)'}
subdir: ${now:%s}_${hydra:job.id}
resume_from: null
load_checkpoint: null

train_split:
  by: window
  p: 0.9

  # by: episode
  # p: 0.9

  # by: episode_idx
  # idx: [0]

num_workers: 6
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: tiny
dump_object: True

trainer:
  default_root_dir: outputs
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  # batch_size: 128
  batch_size: 64
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

wandb:
  enabled: True
  config:
    entity: andrei-jardan-technical-university-of-munich
    project: genai-tetris
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: False

wm:
  type: lewm
  history_size: 3
  num_preds: 1
  hidden_dim: 192
  embed_dim: 192
  patch_projector:
    enabled: false
    # type: linear # or mlp
    # weights: shared # or indep
    # dim: 4
    # hidden_dim: null

predictor:
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0

loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
