defaults:
  - _self_
  - tetris: ???

data:
  dataset:
    num_steps: 2
    frameskip: 1
    name: ${tetris.out}
    keys_to_load:
      - last_cleared_rows

train_split:
  by: window
  p: 0.9

output_model_name: lewm_lines_cleared_probe
subdir: ${now:%s}_${hydra:job.id}

world_model_path: ???

seed: 3072
img_size: ${tetris.tetris.render_size}
num_workers: 6

trainer:
  default_root_dir: outputs
  max_epochs: 50
  devices: auto
  accelerator: gpu
  precision: bf16

wm_loader:
  batch_size: 4096
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

probe_loader:
  batch_size: 1024
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

wandb:
  enabled: True
  config:
    entity: andrei-jardan-technical-university-of-munich
    project: genai-tetris
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: False

lines_cleared_probe:
  num_classes: 5
  embed_dim: 192
  optimizer:
    lr: 1e-3
    weight_decay: 1e-4
