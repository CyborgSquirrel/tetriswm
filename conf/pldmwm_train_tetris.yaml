defaults:
  - _self_
  - tetris: ???
  - action_rank: tetris
  - optimizers: pldmwm

data:
  dataset:
    num_steps: ${eval:'${wm.num_preds} + 1'}   # 1 context frame + num_preds targets
    frameskip: 1
    name: ${tetris.out}
    keys_to_load:
      - pixels
      - action
      - tetris_grid_mask
      - tetris_queue
    keys_to_cache:
      - action

output_model_name: pldmwm
checkpoint_interval: ${eval:'max(1, ${trainer.max_epochs} // 10)'}
subdir: ${now:%s}_${hydra:job.id}
resume_from: null

train_split:
  by: window
  p: 0.9

num_workers: 6
seed: 3072
img_size: 126
dump_object: True
normalize_pixels: True

trainer:
  default_root_dir: outputs
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 64
  num_workers: ${num_workers}
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True

wandb:
  enabled: True
  config:
    entity: andrei-jardan-technical-university-of-munich
    project: genai-tetris
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: False

wm:
  history_size: 1      # GRU only needs the current embedding as hidden state
  num_preds: 16        # teacher-forced rollout steps per window (matches PLDM n_steps=16)
  embed_dim: 512
  action_emb_dim: 64

  # IMPALA CNN encoder (from PLDM seqlen17_3M.yaml: width=2, final_ln=true)
  input_channels: 3
  width: 1
  stack_sizes: [16, 32, 32]
  num_blocks: 2
  final_ln: True

loss:
  # VICReg coefficients from PLDM seqlen17_3M.yaml
  vicreg:
    sim_coeff: 1.0
    std_coeff: 3.0
    cov_coeff: 6.9238
    std_margin: 1.0
    sim_coeff_t: 0.74242
    std_coeff_t: 0.24535
    cov_coeff_t: 0.0
    std_margin_t: 1.0
  # IDM coefficients from PLDM seqlen17_3M.yaml
  idm:
    coeff: 1.072

grid_mask_probe:
  enabled: True
  grid_width: ${tetris.tetris.width}
  grid_height: ${tetris.tetris.height}
  checkpoint_interval: ${checkpoint_interval}
  reset_interval: null
  preview_images: 8
  model:
    type: linear
    hidden_dim: 512
    num_layers: 2
  optimizer:
    lr: 1e-3
    weight_decay: 1e-4

queue_probe:
  enabled: ${eval:'${tetris.tetris.queue_len} > 0'}
  queue_len: ${tetris.tetris.queue_len}
  num_classes: 7
  checkpoint_interval: ${checkpoint_interval}
  reset_interval: null
  model:
    type: linear
    hidden_dim: 512
    num_layers: 2
  optimizer:
    lr: 1e-3
    weight_decay: 1e-4
