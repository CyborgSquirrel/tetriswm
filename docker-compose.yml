version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # Mount current directory so you can edit code without rebuilding
      - .:/app
      # Persist Python cache
      - pip-cache:/root/.cache/pip
    working_dir: /app
    # Keep container running for interactive work
    stdin_open: true
    tty: true
    command: /bin/bash

volumes:
  pip-cache:
