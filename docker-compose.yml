services:
  app-base:
    profiles: ["_base"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        XUID: ${XUID:-}
        XGID: ${XGID:-}
        # DEVICE: ${DEVICE:-}
    volumes:
      # Mount current directory so you can edit code without rebuilding
      - .:/app
      # Wayland socket for GUI apps
      - ${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY:-wayland-0}:/tmp/${WAYLAND_DISPLAY:-wayland-0}
      # X11 fallback (XWayland) for apps that don't support Wayland
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # X11 authentication - mount host's xauth file
      # - ./.Xauthority.docker:/home/user/.Xauthority:rw
      - ./.Xauthority.docker:/home/user/.Xauthority:ro

      # - ./mounts/.stable_worldmodel:/home/user/.stable_worldmodel:rw
      - ./stable_worldmodel:/home/user/.stable_worldmodel:rw
      - ./.venv:/mounts/venv:rw
    environment:
      # Wayland environment
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
      - XDG_RUNTIME_DIR=/tmp
      # X11 fallback
      - DISPLAY=${DISPLAY}
      # Qt and other toolkits - OpenCV's bundled Qt doesn't support Wayland, use X11
      - QT_QPA_PLATFORM=xcb
      - GDK_BACKEND=x11
    working_dir: /app
    # Keep container running for interactive work
    stdin_open: true
    tty: true
    command: /bin/bash
    # Network mode for better compatibility
    network_mode: host
    # IPC for X11
    ipc: host
    # Security options to allow X11 access
    security_opt:
      - seccomp:unconfined
  app-cpu:
    extends:
      service: app-base
    profiles: ["cpu"]
  app-gpu:
    extends:
      service: app-base
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
